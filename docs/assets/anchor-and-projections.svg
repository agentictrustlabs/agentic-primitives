<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1160" width="1920" height="1160">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/></marker><marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c86"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5651d"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a23b3b"/></marker><marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a3"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d4f"/></marker></defs>
<rect width="1920" height="1160" fill="#f7f7f5"/>
<text x="64" y="74" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="44" font-weight="800" fill="#1c2330" text-anchor="start">The anchor and its projections</text>
<text x="64" y="112" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="23" font-weight="400" fill="#5b6675" text-anchor="start">The agent is an account. Names, cards, registry entries, DNS hosts and DIDs are projections of it. Credentials rotate beneath it; authority is granted from it.</text>
<circle cx="960" cy="600" r="170" fill="#1f3a5f"/><circle cx="960" cy="600" r="170" fill="none" stroke="#e6ecf5" stroke-width="6"/><text x="960" y="554" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">THE ANCHOR</text><text x="960" y="588" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="400" fill="#d6dfeb" text-anchor="middle">an ERC-4337 smart account</text><text x="960" y="616" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="17" font-weight="400" fill="#d6dfeb" text-anchor="middle">verifies signatures (ERC-1271)</text><text x="960" y="642" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="17" font-weight="400" fill="#d6dfeb" text-anchor="middle">holds value · issues and revokes</text><text x="960" y="668" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="17" font-weight="400" fill="#d6dfeb" text-anchor="middle">delegations · executes logic</text><text x="960" y="708" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="17" font-weight="700" fill="#fbeedd" text-anchor="middle">the address never changes</text><rect x="94.53340507187079" y="468.5897151161681" width="340" height="92" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="264.5334050718708" y="496.5897151161681" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="800" fill="#0e7c86" text-anchor="middle">Typed name</text><text x="264.5334050718708" y="520.5897151161681" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1c2330" text-anchor="middle">alice.me · outreach.team · outreach.treasury</text><text x="264.5334050718708" y="542.5897151161681" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#5b6675" text-anchor="middle">suffix = agent class, checked on chain</text><line x1="789.9970545731239" y1="554.4478480619564" x2="432.60449884616867" y2="527.5306673712942" stroke="#0e7c86" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="280.88311754568565" y="320.65476220843937" width="340" height="92" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="450.88311754568565" y="348.65476220843937" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="800" fill="#0e7c86" text-anchor="middle">A2A Agent Card</text><text x="450.88311754568565" y="372.65476220843937" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1c2330" text-anchor="middle">capabilities, endpoints</text><text x="450.88311754568565" y="394.65476220843937" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#5b6675" text-anchor="middle">JWS-signed, bound by an EIP-712 proof</text><line x1="835.5492065111677" y1="475.54920651116765" x2="573.9196974721449" y2="402.01010126776674" stroke="#0e7c86" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="603.6502875261851" y="235.24447732460743" width="340" height="92" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="773.6502875261851" y="263.24447732460743" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="800" fill="#0e7c86" text-anchor="middle">Registry entry</text><text x="773.6502875261851" y="287.24447732460743" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1c2330" text-anchor="middle">the kit · ERC-8004 · ANS · HCS</text><text x="773.6502875261851" y="309.24447732460743" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#5b6675" text-anchor="middle">a listing + an admission receipt</text><line x1="914.4478480619564" y1="429.997054573124" x2="818.6848013740238" y2="329.54076863906084" stroke="#0e7c86" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="976.3497124738146" y="235.24447732460743" width="340" height="92" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="1146.3497124738146" y="263.24447732460743" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="800" fill="#0e7c86" text-anchor="middle">DNS host</text><text x="1146.3497124738146" y="287.24447732460743" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1c2330" text-anchor="middle">&lt;label&gt;-&lt;type&gt;.&lt;zone&gt;</text><text x="1146.3497124738146" y="309.24447732460743" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#5b6675" text-anchor="middle">the same name for legacy resolvers</text><line x1="1005.5521519380436" y1="429.99705457312393" x2="1101.315198625976" y2="329.54076863906084" stroke="#0e7c86" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="1299.116882454314" y="320.65476220843925" width="340" height="92" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="1469.116882454314" y="348.65476220843925" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="800" fill="#0e7c86" text-anchor="middle">did:web · ENS</text><text x="1469.116882454314" y="372.65476220843925" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1c2330" text-anchor="middle">where the anchor is served</text><text x="1469.116882454314" y="394.65476220843925" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#5b6675" text-anchor="middle">a locator, never the identity</text><line x1="1084.4507934888322" y1="475.5492065111676" x2="1346.0803025278547" y2="402.01010126776663" stroke="#0e7c86" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="1485.4665949281293" y="468.58971511616824" width="340" height="92" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="1655.4665949281293" y="496.58971511616824" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="800" fill="#0e7c86" text-anchor="middle">Service publication</text><text x="1655.4665949281293" y="520.5897151161682" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1c2330" text-anchor="middle">where it is right now</text><text x="1655.4665949281293" y="542.5897151161682" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#5b6675" text-anchor="middle">sequenced · expiring · per audience</text><line x1="1130.002945426876" y1="554.4478480619564" x2="1487.3955011538314" y2="527.5306673712943" stroke="#0e7c86" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="400" y="140" width="1120" height="40" rx="20" fill="#e0f2f3" stroke="#0e7c86" stroke-width="2"/><text x="960" y="167" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#0e7c86" text-anchor="middle">PROJECTIONS — deterministic renderings, each carrying a proof the anchor signed. Delete one: you lost a listing.</text><rect x="90" y="790" width="500" height="236" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/><path d="M102 790 H578 a12 12 0 0 1 12 12 V836 H90 V802 a12 12 0 0 1 12 -12 Z" fill="#e6ecf5"/><text x="108" y="821" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#1f3a5f" text-anchor="start">CUSTODY — credentials beneath the anchor</text><text x="108" y="866" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">passkeys · hardware wallets · SIWE EOAs · KMS session keys</text><text x="108" y="887.75" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">added, replaced, removed under the CustodyPolicy module:</text><text x="108" y="909.5" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">trustee quorum · guardian quorum · multi-credential recovery</text><text x="108" y="931.25" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start"></text><text x="108" y="953" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">Rotate a key: nothing has to be re-signed.</text><text x="108" y="974.75" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">A compromised key is not a compromised agent.</text><line x1="590" y1="860" x2="840" y2="730" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="715" y="785" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#5b6675" text-anchor="middle">may sign for</text><rect x="1330" y="790" width="500" height="236" rx="12" fill="#ffffff" stroke="#b5651d" stroke-width="2.5"/><path d="M1342 790 H1818 a12 12 0 0 1 12 12 V836 H1330 V802 a12 12 0 0 1 12 -12 Z" fill="#fbeedd"/><text x="1348" y="821" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#b5651d" text-anchor="start">DELEGATIONS — what others may do</text><text x="1348" y="866" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">to an app: a stewardship wire (scoped, revocable)</text><text x="1348" y="887.75" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">to a service: one selector, pinned targets, time-bound</text><text x="1348" y="909.5" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">to a treasury (chartered under it): a MANDATE —</text><text x="1348" y="931.25" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">  intent digest + payee + ceiling + single-use nonce</text><text x="1348" y="953" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start"></text><text x="1348" y="974.75" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#1c2330" text-anchor="start">A token says WHO. A delegation says WHAT.</text><line x1="1080" y1="730" x2="1330" y2="860" stroke="#b5651d" stroke-width="2.5" marker-end="url(#arrowAmber)"/><text x="1205" y="785" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#5b6675" text-anchor="middle">grants, narrowed by caveats</text><rect x="770" y="820" width="380" height="120" rx="12" fill="#fbeedd" stroke="#b5651d" stroke-width="2"/><text x="960" y="856" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="800" fill="#b5651d" text-anchor="middle">TREASURY — its own service agent</text><text x="960" y="884" font-family='"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace' font-size="16" font-weight="400" fill="#1c2330" text-anchor="middle">charteredUnder the person or org</text><text x="960" y="910" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#5b6675" text-anchor="middle">the principal authorizes; the treasury transacts</text><line x1="960" y1="776" x2="960" y2="816" stroke="#b5651d" stroke-width="2.5" marker-end="url(#arrowAmber)"/><rect x="64" y="1060" width="1792" height="44" rx="22" fill="#ebe7f5" stroke="#5b4b8a" stroke-width="2"/><text x="960" y="1089" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#5b4b8a" text-anchor="middle">Every anchor is exactly one of three PROV-O classes — Person · Organization · SoftwareAgent — and the ontology says what each relationship is NOT: charteredUnder is never authority.</text>
<text x="64" y="1126" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#8a94a3" text-anchor="start">ADR-0010 (canonical id) · ADR-0011 (recovery) · ADR-0061 (typed suffixes) · ADR-0062 (card projection) · spec 338 (publications) · 346/347 (names, cards)</text>
<text x="1856" y="1126" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#8a94a3" text-anchor="end">agentictrustlabs/agentic-primitives</text>
</svg>